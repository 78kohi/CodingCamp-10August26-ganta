<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>

  <!-- ───────────── HEADER: Clock, Greeting, Menu ───────────── -->
  <header class="dashboard-header">
    <div>
      <div id="greeting" class="greeting">Good morning!</div>
      <span class="time-date">
        <div id="clock" class="clock">00:00:00</div>
        <div id="date-display" class="date-display"></div>
      </span>
    </div>
    <button class="menu-btn" aria-label="Open menu">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="menu-dropdown hide">
      <ul>
        <li id="theme-toggle-btn" class="menu-item no-select" aria-label="Toggle theme">
          <i class="fa-solid fa-moon"></i>
          <span>Dark mode</span>
        </li>
        <li id="name-form" class="menu-item no-select" aria-label="Add/change name">
          <i class="fa-solid fa-user"></i>
          <span>Add name</span> 
        </li>
      </ul>
    </div>
  </header>

  <!-- ───────────── MAIN GRID ───────────── -->
  <main class="dashboard-grid">

    <!-- TO-DO LIST CARD -->
    <section class="card" id="todo-card" aria-label="To-Do List">
      <h2 class="card-title">
        <span class="card-icon">
          <i class="fa-solid fa-square-check"></i>
        </span> To-Do List
        <span class="task-counter" id="task-counter">0 / 0</span>
      </h2>

      <form class="todo-input-row">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="Add a new task…"
          maxlength="100"
          autocomplete="off"
          aria-label="New task"
        />
        <button id="todo-add-btn" class="btn btn-primary" aria-label="Add task">Add</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite">
        
      </ul>

      <div class="todo-footer">
        <button id="clear-completed-btn" class="hide btn btn-ghost btn-sm">Clear completed</button>
      </div>
    </section>

    <!-- FOCUS TIMER CARD -->
    <section class="card" id="timer-card" aria-label="Focus Timer">
      <h2 class="card-title">
        <span class="card-icon">⏱</span> Focus Timer
      </h2>

      <div class="timer-display" id="timer-display" role="timer" aria-live="polite">
        
      </div>

      <div class="timer-progress-bar">
        <div class="timer-progress-fill" id="timer-progress-fill"></div>
      </div>

      <div class="timer-label" id="timer-label">Pomodoro · 25 min</div>

      <div class="timer-controls">
        <button id="timer-start-btn" class="btn btn-primary" aria-label="Start timer">Start</button>
        <button id="timer-stop-btn"  class="btn btn-secondary" aria-label="Stop timer" disabled>Stop</button>
        <button id="timer-reset-btn" class="btn btn-ghost" aria-label="Reset timer">Reset</button>
      </div>

      <div class="timer-presets">
        <button class="preset-btn active" data-minutes="25">25 min</button>
        <button class="preset-btn" data-minutes="10">10 min</button>
        <button class="preset-btn" data-minutes="5">5 min</button>
        <button id="custom-preset-btn" class="preset-btn" data-minutes="">Custom</button>
        <input
          type="text"
          class="timer-input hide" 
          id="timer-input"
          placeholder="Custom duration…"
          maxlength="3"
          autocomplete="off"
          aria-label="Custom duration"
        >
      </div>
    </section>

    <!-- QUICK LINKS CARD -->
    <section class="card" id="links-card" aria-label="Quick Links">
      <h2 class="card-title">
        <span class="card-icon">🔗</span> Quick Links
      </h2>

      <form class="links-input-area">
        <input
          type="text"
          id="link-name-input"
          class="todo-input"
          placeholder="Label (e.g. Gmail)"
          maxlength="30"
          autocomplete="off"
          aria-label="Link label"
        />
        <input
          type="url"
          id="link-url-input"
          class="todo-input"
          placeholder="https://…"
          autocomplete="off"
          aria-label="Link URL"
        />
        <button id="link-add-btn" class="btn btn-primary" aria-label="Add link">Add</button>
      </form>

      <div id="links-grid" class="links-grid" aria-live="polite">
        
      </div>
    </section>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- MODAL -->
  <dialog id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button id="modal-close-btn" class="modal-close-btn" aria-label="Close modal">
      <i class="fa-solid fa-x"></i>
    </button>
    <div id="modal-content" class="modal-content">
      <h3 id="modal-title">Change Name</h3>
      <input
        type="text"
        id="name-input"
        class="todo-input"
        placeholder="Enter your name"
        maxlength="50"
        aria-label="Your name"
      />
      <button id="name-save-btn" class="btn btn-primary" aria-label="Save name">Save</button>
    </div>
  </dialog>

  <script src="js/script.js"></script>
</body>
</html>
